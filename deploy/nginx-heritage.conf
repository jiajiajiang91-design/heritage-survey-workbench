# heritage.jiajiajiang.com 站点配置（放到 /etc/nginx/conf.d/heritage.conf）
# 证书用腾讯云免费 DV 证书，下载 Nginx 格式后放 /etc/nginx/certs/
server {
    listen 80;
    server_name heritage.jiajiajiang.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name heritage.jiajiajiang.com;

    ssl_certificate /etc/nginx/certs/heritage.jiajiajiang.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/heritage.jiajiajiang.com.key;

    # 前端静态产物（含 54MB 演示包与 pdf.js 资源）
    root /opt/gujian/app/apps/workbench/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 指纹化产物永久缓存；演示包清单不缓存（前端靠它发现新版本）
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /demo/manifest.json { add_header Cache-Control "no-cache"; }

    # 后端：Kimi 助手网关与 CAD 作业。快照上限 32MB，留余量
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;   # CAD 生成与出图是长作业
        client_max_body_size 64m;
        proxy_buffering off;       # 助手回合走 SSE 流式返回
    }

    location / { try_files $uri /index.html; }
}
